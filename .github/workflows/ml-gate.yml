name: ML Regression Gate

# The "team" for a one-person ML workflow. Runs the full training pipeline on
# every PR that touches ML/data code, evaluates the freshly-trained model on
# the frozen PH hold-out, and BLOCKS the merge if any core metric regresses
# beyond tolerance. This is the automated reviewer: a model change cannot land
# on main without proof it did not make PH generalization worse.
#
# Runs on:
#   - PRs touching src/training/, scripts/train*, scripts/import*, scripts/build-ph-holdout,
#     scripts/eval_holdout, services/classifier.ts, data/training/*
#   - schedule: weekly (0 3 * * 1) to catch dataset drift vs the holdout

on:
  pull_request:
    paths:
      - 'src/training/**'
      - 'scripts/train_classifier.py'
      - 'scripts/import-datasets.ts'
      - 'scripts/import-archive.ts'
      - 'scripts/import-xlsx.ts'
      - 'scripts/build-ph-holdout.ts'
      - 'scripts/eval_holdout.py'
      - 'services/classifier.ts'
      - 'data/training/**'
      - 'src/brands/senderAllowlist.ts'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ml-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tolerances vs the committed baseline in data/training/ml-baseline.json.
  # Regressing beyond any of these fails the gate. Current baseline (2026-08-09):
  #   ph_holdout_recall 0.98, ph_holdout_auc 0.98, ph_holdout_f1 0.76
  MIN_PH_RECALL: 0.95
  MIN_PH_AUC: 0.96
  MIN_PH_F1: 0.70

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install Node deps (for TS data pipeline)
        run: npm ci
      - name: Install Python ML deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements-train.txt
      - name: Build corpus (license-gated imports)
        run: npx tsx scripts/import-datasets.ts
      - name: Build PH holdout (frozen, leakage-guarded)
        run: npx tsx scripts/build-ph-holdout.ts
      - name: Fine-tune TinyBERT
        run: python scripts/train_classifier.py --epochs 3 --batch-size 16 --max-len 128 --tag gate
      - name: Evaluate on PH holdout
        run: |
          checkpoint=$(ls -d models/gate/checkpoint-* | head -1)
          threshold=$(python -c "import json; print(json.load(open('models/gate/metrics.json'))['threshold'])")
          python scripts/eval_holdout.py --checkpoint "$checkpoint" --threshold "$threshold" > /tmp/holdout.txt
          cat /tmp/holdout.txt
      - name: Parse + enforce regression gate
        run: |
          python - <<'EOF'
          import json, re
          txt = open("/tmp/holdout.txt").read()
          recall_m = re.search(r"recalled scams: (\d+)/(\d+)", txt)
          recall = int(recall_m.group(1)) / int(recall_m.group(2))
          auc = float(re.search(r"AUC: ([\d.]+)", txt).group(1))
          f1 = float(re.search(r"scam precision: [\d.]+  recall: [\d.]+  F1: ([\d.]+)", txt).group(1))
          ok = True
          checks = [
            ("PH holdout scam recall", recall, float("${{ env.MIN_PH_RECALL }}")),
            ("PH holdout AUC", auc, float("${{ env.MIN_PH_AUC }}")),
            ("PH holdout F1", f1, float("${{ env.MIN_PH_F1 }}")),
          ]
          for name, val, thr in checks:
            passed = val >= thr
            ok = ok and passed
            print(f"{'PASS' if passed else 'FAIL'} {name}: {val:.3f} (gate >= {thr})")
          if not ok:
            raise SystemExit("ML REGRESSION GATE FAILED: metrics dropped below baseline. Do not merge.")
          EOF
