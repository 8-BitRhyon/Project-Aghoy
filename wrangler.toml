name = "project-aghoy-dojo"
main = "src/worker/dojo.ts"
compatibility_date = "2024-09-23"

[durable_objects]
bindings = [
  { name = "DOJO_SESSIONS", class_name = "DojoSession" },
  { name = "RATE_LIMITER", class_name = "RateLimiter" }
]

[ai]
binding = "AI"

# Note: You will need to run `npx wrangler vectorize create scam-index` first
[[vectorize]]
binding = "VECTORIZE"
index_name = "scam-index"

# D1 relational store: reports, indicators, blacklist.
# Create: `npx wrangler d1 create project-aghoy-db`, copy the database_id,
# then apply migrations via `npx wrangler d1 migrations apply project-aghoy-db`.
[[d1_databases]]
binding = "DB"
database_name = "project-aghoy-db"
database_id = "c3463668-1ed1-4355-9efd-e3f0f41a204a"
migrations_dir = "migrations"

# R2 object store: scam evidence (screenshots, evidence briefs, STIX exports).
# R2 is NOT yet enabled on this Cloudflare account, so this binding is commented
# out to allow deployment. Enable R2 in the Cloudflare dashboard, then uncomment
# (or run scripts/setup-storage.sh) and redeploy.
# Create: `npx wrangler r2 bucket create project-aghoy-evidence`
[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "project-aghoy-evidence"

# These tags were first applied to the deployed worker as new_sqlite_classes;
# the earlier new_classes declaration never deployed (free-plan validation
# rejected it), so there are no legacy KV-backed DOs to convert.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DojoSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

# Weekly cron: aggregate the transfer-outcome snapshot every Monday 03:00 UTC.
# The report is persisted to D1 (outcome_snapshots) for the operator to read
# via GET /outcome (admin-gated) - the retention/decay evidence over time.
[triggers]
crons = ["0 3 * * 1"]
